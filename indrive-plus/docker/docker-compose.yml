services:

  postgres:
    image: postgres:16

    container_name: indrive_postgres

    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: indrive

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7

    container_name: indrive_mongo

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7

    container_name: indrive_redis

    restart: always

    ports:
      - "6379:6379"

volumes:

  postgres_data:
  mongo_data: